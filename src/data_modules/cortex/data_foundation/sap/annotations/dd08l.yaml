description: "Relationship definitions"
fields:
  - name: "tabname"
    description: "Table name containing the foreign key"
  - name: "fieldname"
    description: "Name of the foreign key field to be checked"
  - name: "as4local"
    description: "Activation status of repository object"
  - name: "as4vers"
    description: "Version of the entry"
  - name: "checktable"
    description: "Check table name of the foreign key"
  - name: "frkart"
    description: "Dependency factor for semantic foreign keys"
  - name: "clasfield"
    description: "Internal classification of foreign keys: partial, etc."
  - name: "clasvalue"
    description: "Values for classification field of CLAS relationship type"
  - name: "cardleft"
    description: "Left-hand cardinality of the relationship"
  - name: "card"
    description: "Cardinality (right side) of the relationship"
  - name: "checkflag"
    description: "No check in Screen Painter / Check option for foreign key"
  - name: "arbgb"
    description: "Application Area (message class) linked to foreign key validation"
  - name: "msgnr"
    description: "Message number for foreign key validation error"
  - name: "noinherit"
    description: "Flag whether inheritance is switched off for the foreign key"
