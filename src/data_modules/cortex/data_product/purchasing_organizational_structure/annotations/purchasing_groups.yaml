description: "Defines purchasing groups master data from SAP T024, mapping individual purchasing groups to their names, phone numbers, and emails."
fields:
  - name: "client_mandt"
    description: "Client (Mandant), PK"
  - name: "purchasing_group_ekgrp"
    description: "Purchasing Group, PK"
  - name: "purchasing_group_name_eknam"
    description: "Description of purchasing group"
  - name: "purchasing_group_telephone_ektel"
    description: "Telephone number of purchasing group"
  - name: "email_address_smtp_addr"
    description: "E-Mail Address"
  - name: "source_last_updated_at"
    description: "Source Last Updated At"
  - name: "bq_loaded_at"
    description: "BigQuery Loaded At"
