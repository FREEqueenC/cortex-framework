description: "Provides a standardized, global dictionary of active currency codes from SAP TCURC, TCURT, and TCURX, translating raw technical codes into standard ISO-4217 references with accurate decimal configurations and multilingual names."
fields:
  - name: "client_mandt"
    description: "Client"
  - name: "currency_code_waers"
    description: "Currency Key"
  - name: "currency_iso_isocd"
    description: "ISO Code"
  - name: "currency_decimals_currdec"
    description: "Number of decimal places"
  - name: "language_spras"
    description: "Language Key"
  - name: "curr_short_text_ktext"
    description: "Short Text"
  - name: "curr_long_text_ltext"
    description: "Long Text"
  - name: "source_last_updated_at"
    description: "Source Last Updated At"
  - name: "bq_loaded_at"
    description: "BigQuery Loaded At"
