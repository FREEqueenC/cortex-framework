description: "Provides a system-wide language dictionary from SAP T002 and T002T mapping language keys to standardized names to support multilingual localized reporting settings."
fields:
  - name: "language_key_spras"
    description: "Language Key, PK"
  - name: "iso_code_laiso"
    description: "Language ISO Code"
  - name: "description_language_sprsl"
    description: "Description Language, PK"
  - name: "language_name_sptxt"
    description: "Name of the Language"
  - name: "source_last_updated_at"
    description: "Source Last Updated At"
  - name: "bq_loaded_at"
    description: "BQ Loaded At"
