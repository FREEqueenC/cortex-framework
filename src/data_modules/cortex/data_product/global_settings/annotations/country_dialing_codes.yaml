description: "Captures international and country-specific telephone and fax dialing codes from SAP T005K to enable telecommunication metadata lookup."
fields:
  - name: "client_mandt"
    description: "Client (Mandant), PK"
  - name: "country_key_land1"
    description: "Country Key, PK"
  - name: "international_dialing_code_for_telephonefax_teleffrom"
    description: "International dialling code for telephone/fax"
  - name: "country_telephonefax_dialling_code_telefto"
    description: "Country telephone/fax dialling code"
  - name: "digit_to_be_deleted_for_calls_from_abroad_telefrm"
    description: "Digit to be deleted for calls from abroad"
  - name: "foreign_dialling_code_for_telex_telexfrom"
    description: "Foreign dialling code for telex"
  - name: "foreign_dialling_code_for_telex_telexto"
    description: "Foreign dialling code for telex (to)"
  - name: "indicator_mobile_telephones_are_sms_enabled_by_default_mobile_sms"
    description: "Indicator: Mobile telephones are SMS-enabled by default"
  - name: "source_last_updated_at"
    description: "Source Last Updated At"
  - name: "bq_loaded_at"
    description: "BQ Loaded At"
