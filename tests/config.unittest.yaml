buildEnvironment:
  buildProjectId: cortex-connector-test
data:
  bigQueryLocation: US
  sources:
    - id: sap_raw
      projectId: cortex-connector-test
      datasetId: CORTEX_SAP_RAW
    - id: sap_raw_s4
      projectId: cortex-connector-test
      datasetId: CORTEX_SAP_RAW_S4
  targets:
    - id: sap_foundation
      projectId: cortex-connector-test
      datasetId: CORTEX7_SAP_DATA_FOUNDATION
    - id: sap_foundation_s4
      projectId: cortex-connector-test
      datasetId: CORTEX7_SAP_DATA_FOUNDATION_S4
    - id: product_target
      projectId: cortex-connector-test
      datasetId: CORTEX7_DEVELOPMENT_PRODUCT
  namespaces:
    - name: cortex
      path: cortex
  modules:
    foundation:
      - moduleId: erp
        type: cortex.sap
        dataSourceId: sap_raw
        dataTargetId: sap_foundation
        moduleSettings:
          sapVersion: ecc
          mandt: "100"
      - moduleId: erp_s4
        type: cortex.sap
        dataSourceId: sap_raw_s4
        dataTargetId: sap_foundation_s4
        moduleSettings:
          sapVersion: s4
          mandt: "250"
    product:
      - moduleId: sap_plants_and_storage
        type: cortex.plants_and_storage
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_purchasing_organizational_structure
        type: cortex.purchasing_organizational_structure
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_purchasing_documents
        type: cortex.purchasing_documents
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_vendor_invoices
        type: cortex.vendor_invoices
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_vendors
        type: cortex.vendors
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_delivery_documents
        type: cortex.delivery_documents
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_billing_documents
        type: cortex.billing_documents
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_customers
        type: cortex.customers
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_sales_documents
        type: cortex.sales_documents
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_materials
        type: cortex.materials
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_material_batches
        type: cortex.material_batches
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_materials_movement
        type: cortex.materials_movement
        dependsOn:
          sapModule: erp
        dataTargetId: product_target
      - moduleId: sap_sales_organizational_structure
        type: cortex.sales_organizational_structure
        dependsOn:
          sapModule: erp
        dataTargetId: product_target

      - moduleId: sap_global_settings
        type: cortex.global_settings
